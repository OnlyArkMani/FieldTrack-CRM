# FieldTrack — DEV Nginx config.
#
# Pairs with docker-compose-dev.yml's admin-web service (Dockerfile.nginx).
# No TLS here — the shared host Nginx (nginx-backend.sh) terminates TLS for
# the project's public subdomain and reverse-proxies to this container's
# published port. No monitoring/grafana routes either (dev has none running).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html application/json text/css application/javascript;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # cattle-feed-gatipay-backend-dev is the app container_name from
    # docker-compose-dev.yml; both services share the external
    # cattle-feed-gatipay-backend-network-dev network.
    upstream fastapi {
        server cattle-feed-gatipay-backend-dev:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        location = /nginx-health {
            access_log off;
            return 200 "ok";
        }

        # WebSocket: admin live dashboard — must precede the general /api/.
        location /api/v1/ws/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # ── Admin SPA (React/Vite build) ────────────────────────────────
        root /var/www/admin;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
