services:
  cattle-feed-gatipay-backend-dev:
    build:
      context: .
      dockerfile: Dockerfile-dev

    container_name: cattle-feed-gatipay-backend-dev

    restart: always

    env_file:
      - .env

    ports:
      - "3991:8000"

    volumes:
      - /home/wiladmin/ALL_VOLUMES/cattle-feed-gatipay-backend-dev/reports:/srv/fieldtrack/reports
      - /home/wiladmin/ALL_VOLUMES/cattle-feed-gatipay-backend-dev/visit_photos:/srv/fieldtrack/visit_photos

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - cattle-feed-gatipay-backend-network-dev

  cattle-feed-gatipay-backend-admin-web-dev:
    build:
      context: .
      dockerfile: Dockerfile.nginx

    container_name: cattle-feed-gatipay-backend-admin-web-dev

    restart: always

    depends_on:
      cattle-feed-gatipay-backend-dev:
        condition: service_healthy

    ports:
      - "3992:80"

    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - cattle-feed-gatipay-backend-network-dev

networks:
  cattle-feed-gatipay-backend-network-dev:
    external: true