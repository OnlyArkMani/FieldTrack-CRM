services:

  cattle-feed-gatipay-backend-staging:
    build:
      context: .
      dockerfile: Dockerfile-staging

    container_name: cattle-feed-gatipay-backend-staging

    restart: always

    env_file:
      - .env.staging

    ports:
      - "3992:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - cattle-feed-gatipay-backend-network-staging

  cattle-feed-gatipay-backend-admin-web-staging:
    build:
      context: .
      dockerfile: Dockerfile.admin-web

    container_name: cattle-feed-gatipay-backend-admin-web-staging

    restart: always

    ports:
      - "3994:3000"

    networks:
      - cattle-feed-gatipay-backend-network-staging

networks:
  cattle-feed-gatipay-backend-network-staging:
    external: true
